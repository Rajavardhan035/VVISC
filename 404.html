<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | VVISC Technical Club</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(180deg, #051F1A 0%, #031411 100%);
            color: #FBF9F4;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 540px;
            padding: 48px 36px;
            background: rgba(11, 43, 38, 0.6);
            border: 1px solid rgba(197, 168, 128, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }
        .logo-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #0B2B26;
            border: 1.5px solid rgba(197, 168, 128, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            padding: 6px;
            box-shadow: 0 0 24px rgba(197, 168, 128, 0.2);
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.2em;
            color: #D4AF37;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-block;
        }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.6rem;
            color: #FBF9F4;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            color: #B8C7C0;
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #C5A880 0%, #D4AF37 100%);
            color: #051F1A;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.45);
        }
        .btn-secondary {
            background: transparent;
            color: #EAE5DA;
            border: 1px solid rgba(197, 168, 128, 0.35);
        }
        .btn-secondary:hover {
            background: rgba(197, 168, 128, 0.1);
            border-color: #D4AF37;
            color: #FBF9F4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="/assets/logo.png" alt="VVISC Logo">
        </div>
        <span class="tag">Error 404 &bull; Page Not Found</span>
        <h1>Destination Not Located</h1>
        <p>The page you are looking for might have been moved or had its address updated. Let's get you back on track.</p>
        <div class="actions">
            <a href="/index.html" class="btn btn-primary">Return Home</a>
            <a href="/admins/dashboard.html" class="btn btn-secondary">Admin Dashboard</a>
        </div>
    </div>

    <script>
        // Intelligent route resolution: If accessing any admin page without extension, redirect to its .html
        (function() {
            var path = window.location.pathname;
            if (path && path.indexOf('/admins/') === 0 && path.indexOf('.html') === -1) {
                var clean = path.replace(/\/+$/, '');
                window.location.replace(clean + '.html');
            }
        })();
    </script>
</body>
</html>
