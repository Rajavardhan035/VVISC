<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function(){
            var t = localStorage.getItem("vviscTheme") || "dark";
            var a = localStorage.getItem("vviscAccent") || "copper";
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.setAttribute("data-accent", a);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Settings | VVISC Admin Console</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="apple-touch-icon" href="../assets/logo.png">
</head>

<body>

<button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span class="nav-ico" data-icon="menu" style="width:20px;height:20px;"></span>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard">

    <!-- Sidebar -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="adminSidebar" class="sidebar">
        <div class="sidebar-top">
                <img src="../assets/logo.png" alt="VVISC logo" class="sidebar-logo">
                <div class="sidebar-title">
                    <span>VVISC</span>
                    <small>Admin Console</small>
                </div>
            </div>

            <nav>
                <a href="dashboard.html" id="dashboardMenu"><span class="nav-ico" data-icon="dashboard"></span> Dashboard</a>
                <a href="content-management.html" id="contentMenu"><span class="nav-ico" data-icon="layout"></span> Content Management</a>
                <a href="testimonials.html" id="testimonialsMenu"><span class="nav-ico" data-icon="star"></span> Testimonials</a>
                <a href="admins.html" id="adminsMenu"><span class="nav-ico" data-icon="users"></span> Admin Management</a>
                <a href="settings.html" id="settingsMenu"><span class="nav-ico" data-icon="settings"></span> Settings</a>
            </nav>

            <div class="theme-toggle-row">
                <span class="theme-ico ico-sun" data-icon="sun"></span>
                <label class="theme-switch">
                    <input type="checkbox" class="theme-switch-input">
                    <span class="switch-track"></span>
                </label>
                <span class="theme-ico ico-moon" data-icon="moon"></span>
            </div>

            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <a href="content-management.html" style="color:var(--accent-color); text-decoration:none; font-size:0.85rem; font-weight:600;">← Back to Content Management</a>
                <h1 style="margin-top:4px;">Website Settings</h1>
                <p>Manage site name, copyright footer, default SEO titles, and global site preferences.</p>
            </div>
            <div>
                <button id="saveSettingsBtn" class="primary-btn" style="padding:10px 20px; border-radius:8px;">Save Settings</button>
            </div>
        </header>

        <form id="settingsForm" style="display:grid; grid-template-columns: 1fr; gap:20px; margin-top:20px;">

            <!-- Branding Card -->
            <div class="card" style="padding:24px; border-radius:12px;">
                <h3 style="font-size:1.1rem; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">🏷️ Site Branding</h3>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px;">
                    <div>
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Website Name</label>
                        <input type="text" id="siteNameInput" class="form-input" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="VVISC Technical Club">
                    </div>
                    <div>
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Tagline</label>
                        <input type="text" id="siteTagline" class="form-input" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Innovate, Build & Transform">
                    </div>
                </div>

                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Footer Copyright Text</label>
                    <input type="text" id="copyrightTextInput" class="form-input" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="© 2026 VVISC Technical Club. All rights reserved.">
                </div>
            </div>

            <!-- SEO Settings Card -->
            <div class="card" style="padding:24px; border-radius:12px;">
                <h3 style="font-size:1.1rem; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">🔍 Default SEO Metadata</h3>
                
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Default Title Tag</label>
                    <input type="text" id="defaultSeoTitle" class="form-input" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="VVISC Technical Club - VVIT IUCEE Chapter">
                </div>

                <div>
                    <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Default Meta Description</label>
                    <textarea id="defaultSeoDescription" rows="3" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit; font-family:inherit;" placeholder="Official website of VVISC IUCEE Student Chapter at VVIT..."></textarea>
                </div>
            </div>

        </form>

    </main>

</div>

<!-- Firebase Dependencies -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<script src="../firebase-config.js"></script>
<script src="../session.js"></script>
<script src="permissions.js"></script>
<script src="ui.js"></script>
<script src="cms-utils.js"></script>
<script src="website-settings.js"></script>
<script src="logout.js"></script>

</body>
</html>
