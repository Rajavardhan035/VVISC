<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function(){
            var t = localStorage.getItem("vviscTheme") || "dark";
            var a = localStorage.getItem("vviscAccent") || "copper";
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.setAttribute("data-accent", a);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management | VVISC Admin Console</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="apple-touch-icon" href="../assets/logo.png">
</head>

<body>

<button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span class="nav-ico" data-icon="menu" style="width:20px;height:20px;"></span>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard">

    <!-- Sidebar -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="adminSidebar" class="sidebar">
        <div class="sidebar-top">
                <img src="../assets/logo.png" alt="VVISC logo" class="sidebar-logo">
                <div class="sidebar-title">
                    <span>VVISC</span>
                    <small>Admin Console</small>
                </div>
            </div>

            <nav>
                <a href="dashboard.html" id="dashboardMenu"><span class="nav-ico" data-icon="dashboard"></span> Dashboard</a>
                <a href="content-management.html" id="contentMenu"><span class="nav-ico" data-icon="layout"></span> Content Management</a>
                <a href="testimonials.html" id="testimonialsMenu"><span class="nav-ico" data-icon="star"></span> Testimonials</a>
                <a href="admins.html" id="adminsMenu"><span class="nav-ico" data-icon="users"></span> Admin Management</a>
                <a href="settings.html" id="settingsMenu"><span class="nav-ico" data-icon="settings"></span> Settings</a>
            </nav>

            <div class="theme-toggle-row">
                <span class="theme-ico ico-sun" data-icon="sun"></span>
                <label class="theme-switch">
                    <input type="checkbox" class="theme-switch-input">
                    <span class="switch-track"></span>
                </label>
                <span class="theme-ico ico-moon" data-icon="moon"></span>
            </div>

            <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <a href="content-management.html" style="color:var(--accent-color); text-decoration:none; font-size:0.85rem; font-weight:600;">← Back to Content Management</a>
                <h1 style="margin-top:4px;">Department Management</h1>
                <p>Edit department content, responsibilities, skills, and stats rendered on departments.html.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a href="../departments.html" target="_blank" class="secondary-btn" style="padding:10px 16px; text-decoration:none; border-radius:8px;">Preview Page ↗</a>
                <button id="addDeptBtn" class="primary-btn" style="padding:10px 20px; border-radius:8px;">+ Add Department</button>
            </div>
        </header>

        <!-- Department List -->
        <div id="deptListContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:20px; margin-top:20px;">
            <!-- Loaded dynamically -->
        </div>

        <!-- Add/Edit Department Modal -->
        <div id="deptModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center; padding:20px;">
            <div class="card" style="width:100%; max-width:650px; max-height:90vh; overflow-y:auto; padding:24px; border-radius:12px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
                    <h3 id="modalTitle">Edit Department</h3>
                    <button type="button" id="closeModalBtn" style="background:none; border:none; color:inherit; font-size:1.4rem; cursor:pointer;">✕</button>
                </div>

                <form id="deptForm" style="display:grid; gap:14px;">
                    <input type="hidden" id="deptDocId">

                    <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:12px;">
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Department Name *</label>
                            <input type="text" id="deptName" required class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="e.g. Digital Infrastructure Department">
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Slug ID *</label>
                            <input type="text" id="deptSlug" required class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="e.g. digital">
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Icon Emoji</label>
                            <input type="text" id="deptIcon" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="💻">
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Category Tag Badge</label>
                            <input type="text" id="deptTag" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="e.g. Core Department">
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Subtitle / Short Tag</label>
                            <input type="text" id="deptShortDesc" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="e.g. Technology & Systems">
                        </div>
                    </div>

                    <div>
                        <label style="font-size:0.8rem; font-weight:600;">Full Description Paragraph</label>
                        <textarea id="deptDescription" rows="3" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit; font-family:inherit;" placeholder="Describe the department mission and activities..."></textarea>
                    </div>

                    <div>
                        <label style="font-size:0.8rem; font-weight:600;">Responsibilities (comma separated)</label>
                        <input type="text" id="deptObjectives" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Website Development, Software Projects, Hackathon Support">
                    </div>

                    <div>
                        <label style="font-size:0.8rem; font-weight:600;">Skills (comma separated)</label>
                        <input type="text" id="deptActivities" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Python, Java, Web, Cloud, AI">
                    </div>

                    <!-- Department Stats Grid -->
                    <div style="border:1px dashed var(--border-color); padding:12px; border-radius:8px;">
                        <label style="font-size:0.85rem; font-weight:700; color:var(--accent-color); display:block; margin-bottom:8px;">Department Statistics (3 Cards)</label>
                        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                            <div>
                                <label style="font-size:0.75rem; opacity:0.8;">Stat 1 (e.g. 40+)</label>
                                <input type="text" id="stat1Val" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit; margin-bottom:4px;" placeholder="40+">
                                <input type="text" id="stat1Lbl" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Members">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; opacity:0.8;">Stat 2 (e.g. 15+)</label>
                                <input type="text" id="stat2Val" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit; margin-bottom:4px;" placeholder="15+">
                                <input type="text" id="stat2Lbl" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Projects">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; opacity:0.8;">Stat 3 (e.g. 20+)</label>
                                <input type="text" id="stat3Val" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit; margin-bottom:4px;" placeholder="20+">
                                <input type="text" id="stat3Lbl" class="form-input" style="width:100%; padding:6px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;" placeholder="Workshops">
                            </div>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; align-items:center;">
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">Display Order Number</label>
                            <input type="number" id="deptOrder" value="1" class="form-input" style="width:100%; padding:8px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:inherit;">
                        </div>
                        <div style="padding-top:18px;">
                            <label style="cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:600;">
                                <input type="checkbox" id="deptActive" checked> Active / Visible
                            </label>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                        <button type="button" id="cancelModalBtn" class="secondary-btn" style="padding:8px 16px;">Cancel</button>
                        <button type="submit" class="primary-btn" style="padding:8px 20px;">Save Department</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

</div>

<!-- Firebase Dependencies -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<script src="../firebase-config.js"></script>
<script src="../session.js"></script>
<script src="permissions.js"></script>
<script src="ui.js"></script>
<script src="cms-utils.js"></script>
<script src="departments-management.js"></script>
<script src="logout.js"></script>

</body>
</html>
