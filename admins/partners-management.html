<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners &amp; Collaborations — VVISC Admin</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem("vvisc_admin_theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="apple-touch-icon" href="../assets/logo.png">

    <style>
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .partner-card {
            background: var(--card-bg, rgba(30, 41, 59, 0.5));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.25s ease;
        }
        .partner-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
        }
        .partner-logo-box {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            overflow: hidden;
            padding: 10px;
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
        }
        .partner-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

<button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span class="nav-ico" data-icon="menu" style="width:20px;height:20px;"></span>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard">

    <!-- Sidebar Navigation -->
    <aside id="adminSidebar" class="sidebar">
        <div class="sidebar-top">
            <img src="../assets/logo.png" alt="VVISC logo" class="sidebar-logo">
            <div class="sidebar-title">
                <span>VVISC</span>
                <small>Admin Console</small>
            </div>
        </div>

        <nav>
            <a href="dashboard.html" id="dashboardMenu"><span class="nav-ico" data-icon="dashboard"></span> Dashboard</a>
            <a href="content-management.html" id="contentMenu"><span class="nav-ico" data-icon="layout"></span> Content Management</a>
            <a href="partners-management.html" class="active"><span class="nav-ico" data-icon="globe"></span> Partners &amp; Sponsors</a>
            <a href="project-management.html" id="projectsMenu"><span class="nav-ico" data-icon="folderKanban"></span> Project Management</a>
            <a href="testimonials.html" id="testimonialsMenu"><span class="nav-ico" data-icon="star"></span> Testimonials</a>
            <a href="admins.html" id="adminsMenu"><span class="nav-ico" data-icon="users"></span> Admin Management</a>
            <a href="settings.html" id="settingsMenu"><span class="nav-ico" data-icon="settings"></span> Settings</a>
        </nav>

        <div class="theme-toggle-row">
            <span class="theme-ico ico-sun" data-icon="sun"></span>
            <label class="theme-switch">
                <input type="checkbox" class="theme-switch-input">
                <span class="switch-track"></span>
            </label>
            <span class="theme-ico ico-moon" data-icon="moon"></span>
        </div>

        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>🤝 Partners &amp; Sponsors</h1>
                <p>Manage corporate alliances, sponsor branding, and international collaborations.</p>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button id="addPartnerBtn" class="primary-btn" style="padding: 9px 18px; font-size: 0.85rem;">+ Add Partner</button>
                <div class="console-clock"><span class="live-dot"></span><span id="consoleClock"></span></div>
            </div>
        </header>

        <!-- Grid -->
        <section class="partners-grid" id="partnersGrid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted, #94a3b8);">
                Loading partners...
            </div>
        </section>

    </main>

</div>

<!-- Modal -->
<div class="modal-overlay" id="partnerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:20px;">
    <div class="modal-card" style="background:var(--card-bg, #1e293b); border:1px solid var(--border-color, rgba(255,255,255,0.15)); border-radius:16px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto; padding:25px; position:relative;">
        <button id="closeModalBtn" style="position:absolute; top:18px; right:18px; background:transparent; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">&times;</button>
        <h2 id="modalTitle" style="font-size:1.3rem; margin-bottom:15px; color:var(--text-color, #fff);">Add Partner</h2>

        <form id="partnerForm">
            <input type="hidden" id="partnerDocId" value="">

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted,#94a3b8); margin-bottom:5px;">Partner / Company Name *</label>
                <input type="text" id="partnerName" required placeholder="e.g. AWS Educate" style="width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border-color, rgba(255,255,255,0.15)); background:var(--card-bg, rgba(255,255,255,0.06)); color:var(--text-color,#fff);">
            </div>

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted,#94a3b8); margin-bottom:5px;">Category</label>
                <select id="partnerCategory" style="width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border-color, rgba(255,255,255,0.15)); background:var(--card-bg, #1a2333); color:var(--text-color,#fff);">
                    <option value="Academic Partner">Academic Partner</option>
                    <option value="Industry Sponsor">Industry Sponsor</option>
                    <option value="Cloud & Tech Partner">Cloud &amp; Tech Partner</option>
                    <option value="Community Partner">Community Partner</option>
                </select>
            </div>

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted,#94a3b8); margin-bottom:5px;">Website URL</label>
                <input type="url" id="partnerUrl" placeholder="https://company.com" style="width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border-color, rgba(255,255,255,0.15)); background:var(--card-bg, rgba(255,255,255,0.06)); color:var(--text-color,#fff);">
            </div>

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted,#94a3b8); margin-bottom:5px;">Logo Image</label>
                <input type="file" id="partnerLogoFile" accept="image/*" style="width:100%; font-size:0.85rem; color:var(--text-muted,#94a3b8);">
                <input type="hidden" id="partnerLogoUrl" value="">
                <div id="logoPreviewWrap" style="display:none; margin-top:8px;">
                    <img id="logoPreview" src="" alt="Preview" style="max-height:80px; max-width:120px; object-fit:contain;">
                </div>
            </div>

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted,#94a3b8); margin-bottom:5px;">Brief Description</label>
                <textarea id="partnerDesc" rows="2" placeholder="Collaboration scope, cloud credits provided, or academic support..." style="width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border-color, rgba(255,255,255,0.15)); background:var(--card-bg, rgba(255,255,255,0.06)); color:var(--text-color,#fff); font-size:0.88rem;"></textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button type="button" id="cancelBtn" class="secondary-btn" style="padding:9px 16px;">Cancel</button>
                <button type="submit" id="savePartnerBtn" class="primary-btn" style="padding:9px 20px;">Save Partner</button>
            </div>
        </form>
    </div>
</div>

<!-- Firebase Dependencies -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<script src="../firebase-config.js"></script>
<script src="../session.js"></script>
<script src="permissions.js"></script>
<script src="ui.js"></script>
<script src="cms-utils.js"></script>
<script src="partners-management.js"></script>
<script src="logout.js"></script>

</body>
</html>
